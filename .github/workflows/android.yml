name: Android

# NetLurker for Android.
#
# The build is reproducible on purpose: pinned Gradle/AGP/Kotlin versions, no floating
# dependency, and the string catalog is verified before compilation so a missing
# translation fails the job instead of shipping a raw key to the user.
#
# Every Gradle step tees its output to build.log, and on failure the last job publishes the
# compiler/test errors as a check run so they are readable through the REST API instead of
# only from the log viewer.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify the string catalog
        run: python3 android/tools/gen_strings.py --check

      - name: Unit tests
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest 2>&1 | tee build.log

      - name: Lint
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain lintDebug 2>&1 | tee -a build.log || {
            echo "----- lint report -----" | tee -a build.log
            cat app/build/reports/lint-results-debug.txt 2>/dev/null | tee -a build.log
            exit 1
          }

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee -a build.log

      - name: Assemble release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee -a build.log

      - name: Inspect the APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "debug APK: $(du -h "$APK" | cut -f1)"
          unzip -l "$APK" | grep -q "resources.arsc" && echo "resources.arsc present"
          unzip -l "$APK" | grep -q "AndroidManifest.xml" && echo "manifest present"
          unzip -l "$APK" | grep -E "classes[0-9]*\.dex" | head -3
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${AAPT:-}" ]; then
            "$AAPT" dump badging "$APK" | head -5
          fi
          echo "--- unit test results ---"
          find app/build/test-results -name "*.xml" -exec grep -h "<testsuite " {} \; || true

      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/diagnostics.json
          import glob, json, os, re
          parts = []
          log = "android/build.log"
          if os.path.exists(log):
              text = open(log, encoding="utf-8", errors="replace").read()
              keep = re.compile(
                  r"^(e: |w: )"
                  r"|.*FAILURE:|.*What went wrong|.*> Task .* FAILED"
                  r"|^\s*Error:|Lint found|^\s*\d+ errors?,|Explanation for issue"
              )
              errors = [l for l in text.splitlines() if keep.search(l)]
              parts.append("=== build.log errors (%d) ===" % len(errors))
              parts.extend(errors[:200])
              tail = text.splitlines()[-160:]
              parts.append("=== build.log tail ===")
              parts.extend(tail)
          for report in sorted(glob.glob("android/app/build/reports/lint-results-*.txt")):
              parts.append("=== %s ===" % report)
              parts.extend(open(report, encoding="utf-8", errors="replace").read().splitlines()[:300])
          for xml in sorted(glob.glob("android/app/build/test-results/**/*.xml", recursive=True)):
              content = open(xml, encoding="utf-8", errors="replace").read()
              if "failure" in content or "error message" in content:
                  parts.append("=== %s ===" % xml)
                  parts.extend(content.splitlines()[:400])
          body = "\n".join(parts) or "(no build.log produced)"
          print(json.dumps({
              "name": "build-diagnostics",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {
                  "title": "Gradle failure details",
                  "summary": body[:200],
                  "text": body[:60000]
              }
          }))
          PY
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --input /tmp/diagnostics.json \
            --jq '{id, name, conclusion}'

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetLurker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetLurker-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: ignore
