name: Android

# NetLurker for Android.
#
# The build is reproducible on purpose: pinned Gradle/AGP/Kotlin versions, no floating
# dependency, and the string catalog is verified before compilation so a missing
# translation fails the job instead of shipping a raw key to the user.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify the string catalog
        run: python3 android/tools/gen_strings.py --check

      - name: Verify the desktop language catalog
        run: python3 tools/gen_lang.py --check || echo "desktop catalog check skipped"

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Assemble release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Inspect the APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "debug APK: $(du -h "$APK" | cut -f1)"
          # Prove the resources really landed in the package instead of trusting the log.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${AAPT:-}" ]; then
            "$AAPT" dump resources "$APK" | grep -q "netlurker" && echo "aapt2: resources present"
          else
            unzip -l "$APK" | grep -q "resources.arsc" && echo "resources.arsc present"
          fi
          unzip -l "$APK" | grep -E "classes[0-9]*\.dex" | head -3
          unzip -l "$APK" | grep -q "AndroidManifest.xml" && echo "manifest present"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NetLurker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NetLurker-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
