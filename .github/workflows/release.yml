name: Release

# Publish a GitHub Release in the UI: the files are attached to THAT release.
# A dispatch defaults to preparation only: no release/tag is created or changed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v6.0.1 or v6.0.1-rc.1 (dry run uses the selected branch)"
        type: string
        required: true
      publish:
        description: "Upload to an existing published release for this tag (otherwise artifacts only)"
        type: boolean
        default: false
      run-emulator:
        description: "Also require emulator UI tests (additional runner time)"
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version, target and signing policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      windows_version: ${{ steps.prepare.outputs.windows_version }}
      tag: ${{ steps.prepare.outputs.tag }}
      revision: ${{ steps.prepare.outputs.revision }}
      release_id: ${{ steps.prepare.outputs.release_id }}
      publish: ${{ steps.prepare.outputs.publish }}
      android: ${{ steps.prepare.outputs.android }}
      windows_signed: ${{ steps.prepare.outputs.windows_signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate before spending build minutes
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          REQUIRE_ANDROID_RELEASE: ${{ vars.REQUIRE_ANDROID_RELEASE }}
          REQUIRE_WINDOWS_SIGNATURE: ${{ vars.REQUIRE_WINDOWS_SIGNATURE }}
        run: python tools/release_ops.py prepare --tag "$TAG" --publish "$PUBLISH"

  build:
    name: Test and build exact release revision
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      source-ref: ${{ needs.prepare.outputs.revision }}
      release-version: ${{ needs.prepare.outputs.version }}
      run-emulator: ${{ inputs.run-emulator || vars.RELEASE_RUN_EMULATOR == 'true' }}

  windows:
    name: Windows portable bundle and installer
    needs: [prepare, build]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NUMERIC_VERSION: ${{ needs.prepare.outputs.windows_version }}
      REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NetLurker-windows-x64
          path: build
      - name: Verify tested artifact and stamp packaging metadata
        shell: pwsh
        run: |
          python tools/release_ops.py verify-input --input build --version $env:VERSION --revision $env:REVISION
          if ($LASTEXITCODE -ne 0) { throw "Artifact provenance check failed" }
          python tools/release_version.py --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "Version validation failed" }
          if ((Get-Item build/NetLurker.exe).VersionInfo.ProductVersion.Trim() -ne $env:VERSION) { throw "Wrong EXE version" }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Sign the executable when configured
        if: needs.prepare.outputs.windows_signed == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $cert = Join-Path $env:RUNNER_TEMP 'netlurker-signing.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          & ./tools/sign_release.ps1 -File build/NetLurker.exe -Cert $cert -Password $env:WINDOWS_CERT_PASSWORD
      - name: Build versioned per-user installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is required on the Windows runner" }
          & $iscc "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:NUMERIC_VERSION" installer/NetLurker.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if ((Get-Item "dist/NetLurker-v$env:VERSION-setup.exe").VersionInfo.ProductVersion.Trim() -ne $env:VERSION) { throw "Installer version mismatch" }
      - name: Sign the installer when configured
        if: needs.prepare.outputs.windows_signed == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & ./tools/sign_release.ps1 -File "dist/NetLurker-v$env:VERSION-setup.exe" -Cert (Join-Path $env:RUNNER_TEMP 'netlurker-signing.pfx') -Password $env:WINDOWS_CERT_PASSWORD
      - name: Package and record actual signature status
        shell: pwsh
        env:
          SIGNED: ${{ needs.prepare.outputs.windows_signed }}
        run: |
          python tools/package_release.py --input build --output release-assets --version $env:VERSION --revision $env:REVISION --public
          if ($LASTEXITCODE -ne 0) { throw "Package validation failed" }
          # The final job writes one checksum list covering ALL platforms.
          Remove-Item release-assets/SHA256SUMS.txt
          $installer = "NetLurker-v$env:VERSION-setup.exe"
          Copy-Item "dist/$installer" release-assets/
          $files = @(foreach ($path in @('build/NetLurker.exe', "release-assets/$installer")) {
            $sig = Get-AuthenticodeSignature $path
            $expected = if ($env:SIGNED -eq 'true') { 'Valid' } else { 'NotSigned' }
            if ($sig.Status.ToString() -ne $expected) { throw "Unexpected signature status on $path : $($sig.Status)" }
            @{
              name = Split-Path -Leaf $path
              status = $sig.Status.ToString()
              sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
              certificate_sha256 = if ($sig.SignerCertificate) { $sig.SignerCertificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToLower() } else { $null }
            }
          })
          @{version=$env:VERSION; source_revision=$env:REVISION; files=$files} | ConvertTo-Json -Depth 5 | Set-Content release-assets/windows-signatures.json -Encoding utf8
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'netlurker-signing.pfx') -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Sign and verify production Android APK
    needs: [prepare, build]
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NetLurker-release-apk
          path: android-input
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign aligned APK and verify identity, version and certificate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python tools/sign_android.py --input android-input --output release-assets --version "$VERSION" --revision "$REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Verify complete asset set and create checksums
    needs: [prepare, windows, android]
    if: ${{ !cancelled() && needs.windows.result == 'success' && (needs.android.result == 'success' || (needs.prepare.outputs.android == 'false' && needs.android.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Build manifest and verify every checksum
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          ANDROID: ${{ needs.prepare.outputs.android }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/release_ops.py manifest --directory release-assets --version "$VERSION" --revision "$REVISION" --android "$ANDROID" --run-url "$RUN_URL"
          echo '## Release assets prepared' >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'No device test or code-signing claim is implied by a checksum. See RELEASE-MANIFEST.json.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NetLurker-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach verified assets to the existing release
    needs: [prepare, bundle]
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NetLurker-release-assets
          path: release-assets
      - name: Upload without clobbering, verify remote digests, preserve user notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python tools/release_ops.py publish --directory release-assets --tag "$TAG" --revision "$REVISION" --release-id "$RELEASE_ID"
      - name: Publication failure instructions
        if: failure()
        run: |
          echo '## Release upload failed — do not treat a partial asset set as complete' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fix the reported problem and re-run failed jobs to reuse the same prepared bytes. Existing different assets are never overwritten; do not move/reuse version tags.' >> "$GITHUB_STEP_SUMMARY"
